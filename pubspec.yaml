name: dashcore
description: "DashCore - Open-source OBD2 dashboard app for real-time car data and diagnostics."
homepage: https://github.com/iUnreallx/DashCore
version: 2.0.1+3

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_svg: ^2.2.3
  provider: ^6.1.5+1
  flutter_blue_classic: ^0.0.9
  permission_handler: ^12.0.1
  device_info_plus: ^12.4.0
  flutter_native_splash: ^2.4.7
  image_picker: ^1.1.2
  file_picker: ^8.3.7
  share_plus: ^10.1.3
  geolocator: ^13.0.1
  usb_serial: 0.6.0
  nowplaying: ^3.0.3
  package_info_plus: ^8.3.1
  shared_preferences: ^2.5.5
  path_provider: ^2.1.3
  http: ^1.2.1
  supabase_flutter: ^2.17.2
  archive: 4.2.0
  url_launcher: ^6.3.0
  flutter_secure_storage: ^9.2.2
  flutter_dotenv: ^5.1.0
  youtube_player_flutter: ^9.1.1
  video_player: ^2.9.2
  webview_flutter: ^4.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/svg/
    - assets/images/svg/dashboard/
    - assets/images/svg/bottomBar/
    - assets/images/png/
    - assets/images/png/vehicle_previews/
    - assets/icons/dashcore_v2.png
    - assets/tutorial/
    - assets/web/three/
    - assets/world_map.svg

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/dashcore_v2.png"
  adaptive_icon_background: "#080B10"
  adaptive_icon_foreground: "assets/icons/dashcore_v2.png"
  min_sdk_android: 21
  remove_alpha_ios: true

  web:
    generate: true
    image_path: "assets/icons/dashcore_v2.png"

  windows:
    generate: true
    image_path: "assets/icons/dashcore_v2.png"

flutter_native_splash:
  color: "#080B10"
  image: assets/icons/dashcore_v2.png
  color_dark: "#080B10"
  image_dark: assets/icons/dashcore_v2.png
  android: true
  ios: true
  web: false

  android_12:
    color: "#080B10"
    image: assets/icons/dashcore_v2.png
    icon_background_color: "#080B10"
